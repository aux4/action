name: 'aux4'
description: 'Lint, test, publish, and cloud-deploy aux4 packages'
author: 'aux4'

branding:
  icon: 'terminal'
  color: 'blue'

inputs:
  command:
    description: 'Command to run: lint, test, publish, or cloud-deploy'
    required: true

  # Common
  working_directory:
    description: 'Working directory containing the repository'
    required: false
    default: '.'
  package_directory:
    description: 'Directory containing the package .aux4 file'
    required: false
    default: 'package'
  system_packages:
    description: 'Space-separated list of system packages to install (apt/brew)'
    required: false
    default: ''
  npm_packages:
    description: 'Space-separated list of global npm packages to install'
    required: false
    default: ''
  packages:
    description: 'Space-separated list of aux4 packages to install'
    required: false
    default: ''
  build_command:
    description: 'Command to build the package (e.g., npm run build, aux4 builder linux)'
    required: false
    default: ''

  # Lint
  strict:
    description: '[lint] Strict mode — treats -local versions as errors'
    required: false
    default: 'false'
  resolve:
    description: '[lint] Resolve mode — validates aux4 command calls against installed packages'
    required: false
    default: 'false'
  format:
    description: '[lint] Output format (text or json)'
    required: false
    default: 'text'

  # Test
  test_directory:
    description: '[test] Directory containing the test files'
    required: false
    default: 'test'
  coverage_threshold:
    description: '[test] Minimum step coverage percentage (0-100). Fails if below. Set to 0 to disable.'
    required: false
    default: '0'

  # Publish
  level:
    description: '[publish] Release level (patch, minor, major)'
    required: false
    default: 'patch'
  aux4_token:
    description: '[publish] aux4 access token for publishing to hub.aux4.io'
    required: false
    default: ''
  github_token:
    description: '[publish] GitHub token for creating releases'
    required: false
    default: ''
  aux4_image:
    description: '[publish] Docker image for aux4'
    required: false
    default: 'aux4/aux4:latest'

  # Cloud Deploy
  scope:
    description: '[cloud-deploy] Target scope for the deployment'
    required: false
    default: ''
  machine:
    description: '[cloud-deploy] Machine (VM) name — the deployment identity; defaults to the package name for a single package'
    required: false
    default: ''
  deploy_packages:
    description: '[cloud-deploy] Packages to deploy, one per line: [<repository>:]<scope>/<name>[@<version>] (repository defaults to public; prefix private: or system:)'
    required: false
    default: ''
  version:
    description: '[cloud-deploy] Default version for packages given without @version'
    required: false
    default: 'latest'
  size:
    description: '[cloud-deploy] Machine size: xs, sm, md, lg, xl'
    required: false
    default: 'sm'
  timeout:
    description: '[cloud-deploy] Lambda timeout in seconds'
    required: false
    default: '120'
  api:
    description: '[cloud-deploy] Deploy as an HTTP API behind an API Gateway (requires exactly one package)'
    required: false
    default: 'false'
  env:
    description: '[cloud-deploy] Environment variables to set on the machine, one NAME=value per line'
    required: false
    default: ''
  api_url:
    description: '[cloud-deploy] Cloud API base URL'
    required: false
    default: 'https://api.aux4.cloud'
  client_id:
    description: '[cloud-deploy] OAuth client id to mint a token via the client_credentials grant (see README — cloud:deploy machine tokens are not accepted by the cloud API yet)'
    required: false
    default: ''
  client_secret:
    description: '[cloud-deploy] OAuth client secret used with client_id for client_credentials'
    required: false
    default: ''
  sso_url:
    description: '[cloud-deploy] SSO base URL used to mint a token when client_id/client_secret are provided'
    required: false
    default: 'https://sso.aux4.io'

outputs:
  version:
    description: 'The new package version (publish only)'
    value: ${{ steps.version.outputs.version }}
  scope:
    description: 'The package scope (publish only)'
    value: ${{ steps.version.outputs.scope }}
  name:
    description: 'The package name (publish only)'
    value: ${{ steps.version.outputs.name }}

runs:
  using: 'composite'
  steps:
    # ── Setup ──────────────────────────────────────────────

    - name: Install aux4
      shell: bash
      run: |
        if command -v aux4 &>/dev/null; then
          echo "aux4 already installed"
          exit 0
        fi
        curl -fsSL https://aux4.sh | sh
        echo "$HOME/.aux4.config/packages/aux4/aux4" >> $GITHUB_PATH

    - name: Install pkger
      shell: bash
      run: |
        if aux4 aux4 pkger list &>/dev/null; then
          echo "pkger already installed"
          exit 0
        fi
        curl -fsSL https://pkger.aux4.sh | sh

    - name: Register a system package provider
      shell: bash
      run: |
        # pkger resolves a package's OWN declared system dependencies (e.g. aux4/browser
        # needs chromium) through an installer provider. With none registered it fails with
        # "No package manager available". Pick the provider that matches whatever package
        # manager this runner actually has, rather than assuming one per OS.
        # Native manager first: GitHub's ubuntu images also ship Homebrew, and picking brew
        # there would install through the wrong one.
        if command -v apt-get >/dev/null 2>&1; then
          PROVIDER=apt
        elif command -v dnf >/dev/null 2>&1; then
          PROVIDER=dnf
        elif command -v yum >/dev/null 2>&1; then
          PROVIDER=yum
        elif command -v apk >/dev/null 2>&1; then
          PROVIDER=apk
        elif command -v brew >/dev/null 2>&1; then
          PROVIDER=brew
        else
          echo "::warning::No system package manager found; packages with system dependencies will fail to install"
          exit 0
        fi

        if aux4 aux4 pkger list 2>/dev/null | grep -q "system-installer-${PROVIDER}"; then
          echo "system-installer-${PROVIDER} already installed"
        else
          echo "Registering system package provider: ${PROVIDER}"
          aux4 aux4 pkger install "aux4/system-installer-${PROVIDER}"
        fi

    - name: Install system packages
      if: inputs.system_packages != ''
      shell: bash
      run: |
        for pkg in ${{ inputs.system_packages }}; do
          echo "Installing system package: $pkg"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y "$pkg"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install "$pkg"
          else
            echo "::warning::Unsupported OS for system packages: $RUNNER_OS"
          fi
        done

    - name: Install npm packages
      if: inputs.npm_packages != ''
      shell: bash
      run: |
        for pkg in ${{ inputs.npm_packages }}; do
          echo "Installing npm package: $pkg"
          npm i -g "$pkg"
        done

    - name: Install aux4 packages
      if: inputs.packages != ''
      shell: bash
      run: |
        for pkg in ${{ inputs.packages }}; do
          echo "Installing aux4 package: $pkg"
          aux4 aux4 pkger install "$pkg"
        done

    - name: Build package
      if: inputs.build_command != ''
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "Building: ${{ inputs.build_command }}"
        ${{ inputs.build_command }}

    # ── Lint ───────────────────────────────────────────────

    - name: Install aux4/lint
      if: inputs.command == 'lint'
      shell: bash
      run: |
        aux4 aux4 pkger install aux4/lint

    - name: Run linter
      if: inputs.command == 'lint'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "Linting .aux4 files in ${{ inputs.package_directory }}"
        aux4 lint run \
          --dir "${{ inputs.package_directory }}" \
          --format "${{ inputs.format }}" \
          --strict "${{ inputs.strict }}" \
          --resolve "${{ inputs.resolve }}"

    # ── Test ───────────────────────────────────────────────

    - name: Install jest
      if: inputs.command == 'test'
      shell: bash
      run: |
        npm i -g jest

    - name: Install aux4/test
      if: inputs.command == 'test'
      shell: bash
      run: |
        aux4 aux4 pkger install aux4/test

    - name: Package and install for testing
      if: inputs.command == 'test'
      shell: bash
      working-directory: ${{ inputs.working_directory }}/${{ inputs.package_directory }}
      run: |
        if [ ! -f ".aux4" ]; then
          echo "::error::Package metadata not found at .aux4"
          exit 1
        fi

        SCOPE=$(jq -r '.scope' ".aux4")
        NAME=$(jq -r '.name' ".aux4")
        VERSION=$(jq -r '.version' ".aux4")

        echo "Packaging ${SCOPE}/${NAME}@${VERSION}"
        aux4 aux4 pkger build .

        PACKAGE_FILE="${SCOPE}_${NAME}_${VERSION}.zip"
        if [ ! -f "$PACKAGE_FILE" ]; then
          echo "::error::Package file not found: ${PACKAGE_FILE}"
          exit 1
        fi

        echo "Installing package from ${PACKAGE_FILE}"
        aux4 aux4 pkger install --fromFile "$PACKAGE_FILE"

    - name: Run tests
      if: inputs.command == 'test'
      shell: bash
      run: |
        PACKAGE_AUX4="${{ inputs.working_directory }}/${{ inputs.package_directory }}/.aux4"
        SCOPE=$(jq -r '.scope' "$PACKAGE_AUX4")
        NAME=$(jq -r '.name' "$PACKAGE_AUX4")

        TEST_DIR="$HOME/.aux4.config/packages/${SCOPE}/${NAME}/${{ inputs.test_directory }}"
        if [ ! -d "$TEST_DIR" ]; then
          echo "::error::Test directory not found at ${TEST_DIR}"
          exit 1
        fi

        cd "$TEST_DIR"
        THRESHOLD="${{ inputs.coverage_threshold }}"

        if [ "$THRESHOLD" != "0" ] && [ -n "$THRESHOLD" ]; then
          echo "Running tests with coverage (threshold: ${THRESHOLD}%)"
          aux4 test coverage --threshold "$THRESHOLD"
        else
          echo "Running tests"
          aux4 test run
        fi

    # ── Publish ────────────────────────────────────────────

    - name: Configure git
      if: inputs.command == 'publish'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull latest changes
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        git pull --rebase origin ${{ github.ref_name }}

    - name: Get current package info
      if: inputs.command == 'publish'
      id: current
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        PACKAGE_AUX4="${{ inputs.package_directory }}/.aux4"
        if [ ! -f "$PACKAGE_AUX4" ]; then
          echo "::error::Package metadata not found at ${PACKAGE_AUX4}"
          exit 1
        fi
        SCOPE=$(jq -r '.scope' "$PACKAGE_AUX4")
        NAME=$(jq -r '.name' "$PACKAGE_AUX4")
        CURRENT_VERSION=$(jq -r '.version' "$PACKAGE_AUX4")
        PRIVATE=$(jq -r '.private // false' "$PACKAGE_AUX4")
        echo "scope=${SCOPE}" >> $GITHUB_OUTPUT
        echo "name=${NAME}" >> $GITHUB_OUTPUT
        echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
        echo "private=${PRIVATE}" >> $GITHUB_OUTPUT
        echo "::notice::Found package ${SCOPE}/${NAME} at version ${CURRENT_VERSION} (private: ${PRIVATE})"

    - name: Increment version
      if: inputs.command == 'publish'
      id: version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        PACKAGE_AUX4="${{ inputs.package_directory }}/.aux4"
        CURRENT_VERSION="${{ steps.current.outputs.current_version }}"
        LEVEL="${{ inputs.level }}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

        case "$LEVEL" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "scope=${{ steps.current.outputs.scope }}" >> $GITHUB_OUTPUT
        echo "name=${{ steps.current.outputs.name }}" >> $GITHUB_OUTPUT

        jq --arg v "$NEW_VERSION" '.version = $v' "$PACKAGE_AUX4" > "${PACKAGE_AUX4}.tmp" && mv "${PACKAGE_AUX4}.tmp" "$PACKAGE_AUX4"

        echo "::notice::Version bumped from ${CURRENT_VERSION} to ${NEW_VERSION}"

    - name: Pull latest aux4 image
      if: inputs.command == 'publish'
      shell: bash
      run: |
        docker pull ${{ inputs.aux4_image }}

    - name: Build package for publishing
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v $(pwd):/workspace \
          -w /workspace \
          ${{ inputs.aux4_image }} \
          aux4 pkger build ${{ inputs.package_directory }}

    - name: Publish to hub.aux4.io
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        AUX4_ACCESS_TOKEN: ${{ inputs.aux4_token }}
      run: |
        SCOPE="${{ steps.current.outputs.scope }}"
        NAME="${{ steps.current.outputs.name }}"
        VERSION="${{ steps.version.outputs.version }}"
        PACKAGE_FILE="${SCOPE}_${NAME}_${VERSION}.zip"

        AUX4_ACCESS_TOKEN=$(echo -n "$AUX4_ACCESS_TOKEN" | tr -d '[:space:]')

        # Route private packages to the "private" repository (pkger defaults to "public")
        REPO_ARG=""
        if [ "${{ steps.current.outputs.private }}" = "true" ]; then
          REPO_ARG="--repository private "
          echo "::notice::Publishing ${SCOPE}/${NAME} to the PRIVATE repository"
        fi

        docker run --rm \
          --user $(id -u):$(id -g) \
          -v $(pwd):/workspace \
          -w /workspace \
          -e AUX4_ACCESS_TOKEN="${AUX4_ACCESS_TOKEN}" \
          --entrypoint sh \
          ${{ inputs.aux4_image }} \
          -c "aux4 aux4 pkger publish ${REPO_ARG}\"${PACKAGE_FILE}\""

    - name: Commit and tag
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        PACKAGE_AUX4="${{ inputs.package_directory }}/.aux4"

        git add "$PACKAGE_AUX4"
        git commit -m "release: ${VERSION}"
        git tag -a "v${VERSION}" -m "release: v${VERSION}"

    - name: Push changes and tags
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        git push origin ${{ github.ref_name }}
        git push origin --tags

    - name: Create GitHub Release
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        SCOPE="${{ steps.current.outputs.scope }}"
        NAME="${{ steps.current.outputs.name }}"
        VERSION="${{ steps.version.outputs.version }}"
        PACKAGE_FILE="${SCOPE}_${NAME}_${VERSION}.zip"

        if [ -f "${PACKAGE_FILE}" ]; then
          gh release create "v${VERSION}" \
            "${PACKAGE_FILE}" \
            --title "Release v${VERSION}" \
            --notes "Release of ${SCOPE}/${NAME} v${VERSION}"
        else
          gh release create "v${VERSION}" \
            --title "Release v${VERSION}" \
            --notes "Release of ${SCOPE}/${NAME} v${VERSION}"
        fi

    - name: Cleanup
      if: inputs.command == 'publish'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        SCOPE="${{ steps.current.outputs.scope }}"
        NAME="${{ steps.current.outputs.name }}"
        VERSION="${{ steps.version.outputs.version }}"
        rm -f "${SCOPE}_${NAME}_${VERSION}.zip"

    # ── Cloud Deploy ───────────────────────────────────────

    - name: Install aux4/cloud
      if: inputs.command == 'cloud-deploy'
      shell: bash
      run: |
        aux4 aux4 pkger install aux4/cloud

    - name: Establish authentication
      if: inputs.command == 'cloud-deploy'
      shell: bash
      env:
        AUX4_TOKEN: ${{ inputs.aux4_token }}
        CLIENT_ID: ${{ inputs.client_id }}
        CLIENT_SECRET: ${{ inputs.client_secret }}
        SSO_URL: ${{ inputs.sso_url }}
      run: |
        set -euo pipefail

        TOKEN=""
        if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ]; then
          echo "Minting an access token via the client_credentials grant..."
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            -d scope=cloud:deploy \
            "${SSO_URL%/}/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to mint an access token from ${SSO_URL%/}/token. Verify client_id/client_secret and that the client is granted the 'cloud:deploy' scope."
            exit 1
          fi
        elif [ -n "$AUX4_TOKEN" ]; then
          echo "Using the provided aux4_token."
          TOKEN="$AUX4_TOKEN"
        else
          echo "::error::No credentials provided. Supply either 'aux4_token' or both 'client_id' and 'client_secret'."
          exit 1
        fi

        TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
        echo "::add-mask::$TOKEN"
        echo "AUX4_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Deploy to aux4.cloud
      if: inputs.command == 'cloud-deploy'
      shell: bash
      env:
        DEPLOY_SCOPE: ${{ inputs.scope }}
        DEPLOY_NAME: ${{ inputs.machine }}
        DEPLOY_PACKAGES: ${{ inputs.deploy_packages }}
        DEPLOY_VERSION: ${{ inputs.version }}
        DEPLOY_SIZE: ${{ inputs.size }}
        DEPLOY_TIMEOUT: ${{ inputs.timeout }}
        DEPLOY_API: ${{ inputs.api }}
        DEPLOY_ENV: ${{ inputs.env }}
        DEPLOY_API_URL: ${{ inputs.api_url }}
      run: |
        set -euo pipefail

        # trim leading/trailing whitespace from a single line
        trim() {
          local s="$1"
          s="${s#"${s%%[![:space:]]*}"}"
          s="${s%"${s##*[![:space:]]}"}"
          printf '%s' "$s"
        }

        if [ -z "$(trim "$DEPLOY_SCOPE")" ]; then
          echo "::error::'scope' is required for cloud-deploy."
          exit 1
        fi

        ARGS=(deploy)

        NAME=$(trim "$DEPLOY_NAME")
        [ -n "$NAME" ] && ARGS+=(--name "$NAME")

        ARGS+=(--scope "$(trim "$DEPLOY_SCOPE")")

        # Expand the multiline `deploy_packages` input into one --package flag per line.
        PKG_COUNT=0
        while IFS= read -r line || [ -n "$line" ]; do
          line=$(trim "$line")
          [ -z "$line" ] && continue
          ARGS+=(--package "$line")
          PKG_COUNT=$((PKG_COUNT + 1))
        done <<< "$DEPLOY_PACKAGES"

        if [ "$PKG_COUNT" -eq 0 ]; then
          echo "::error::No packages provided. 'deploy_packages' must contain at least one [repo:]scope/name[@version] line."
          exit 1
        fi

        if [ "$(trim "$DEPLOY_API")" = "true" ]; then
          ARGS+=(--api true)
        fi

        ARGS+=(--version "$(trim "$DEPLOY_VERSION")")
        ARGS+=(--size "$(trim "$DEPLOY_SIZE")")
        ARGS+=(--timeout "$(trim "$DEPLOY_TIMEOUT")")

        # Expand the multiline `env` input into one --env flag per line.
        while IFS= read -r line || [ -n "$line" ]; do
          line=$(trim "$line")
          [ -z "$line" ] && continue
          ARGS+=(--env "$line")
        done <<< "$DEPLOY_ENV"

        ARGS+=(--apiUrl "$(trim "$DEPLOY_API_URL")")

        echo "Running: aux4 aux4 cloud ${ARGS[*]}"
        aux4 aux4 cloud "${ARGS[@]}"
